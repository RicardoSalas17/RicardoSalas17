<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ricardo Salas banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0a1b2b"/>
      <stop offset="100%" stop-color="#120a2e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(0,0,0,0.45)"/>
    </filter>

    <style>
      .title { font: 700 54px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #fff; }
      .subtitle { font: 500 22px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(255,255,255,0.85); }
      .meta { font: 500 18px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(255,255,255,0.75); }
      .chipText { font: 600 16px/1 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(255,255,255,0.92); letter-spacing: 0.2px; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .pill { fill: rgba(0,0,0,0.25); stroke: rgba(255,255,255,0.10); stroke-width: 1; }
      .accentLine { fill: url(#accent); opacity: 0.95; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Accent glow shapes -->
  <circle cx="1040" cy="90" r="150" fill="rgba(96,165,250,0.14)"/>
  <circle cx="160" cy="280" r="180" fill="rgba(167,139,250,0.12)"/>
  <circle cx="860" cy="300" r="120" fill="rgba(34,197,94,0.12)"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="60" y="48" rx="28" ry="28" width="1080" height="264" class="pill"/>
    <rect x="60" y="48" rx="28" ry="28" width="1080" height="264" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
  </g>

  <!-- Accent line -->
  <rect x="88" y="86" width="420" height="8" rx="4" class="accentLine"/>

  <!-- Text -->
  <text x="88" y="160" class="title">Ricardo Salas</text>
  <text x="88" y="200" class="subtitle">Full Stack (React/Next.js/TypeScript) • React Native</text>
  <text x="88" y="236" class="meta">MERN • WebSockets/Socket.IO • Stripe • Cloudinary • WordPress • Moodle</text>

  <!-- Chips -->
  <!-- Row 1 -->
  <g transform="translate(88, 258)">
    <rect x="0" y="0" rx="16" ry="16" width="92" height="34" class="chip"/>
    <text x="46" y="22" text-anchor="middle" class="chipText">React</text>

    <rect x="104" y="0" rx="16" ry="16" width="108" height="34" class="chip"/>
    <text x="158" y="22" text-anchor="middle" class="chipText">Next.js</text>

    <rect x="224" y="0" rx="16" ry="16" width="132" height="34" class="chip"/>
    <text x="290" y="22" text-anchor="middle" class="chipText">TypeScript</text>

    <rect x="368" y="0" rx="16" ry="16" width="142" height="34" class="chip"/>
    <text x="439" y="22" text-anchor="middle" class="chipText">React Native</text>

    <rect x="522" y="0" rx="16" ry="16" width="86" height="34" class="chip"/>
    <text x="565" y="22" text-anchor="middle" class="chipText">Expo</text>

    <rect x="620" y="0" rx="16" ry="16" width="104" height="34" class="chip"/>
    <text x="672" y="22" text-anchor="middle" class="chipText">Node.js</text>

    <rect x="736" y="0" rx="16" ry="16" width="110" height="34" class="chip"/>
    <text x="791" y="22" text-anchor="middle" class="chipText">MongoDB</text>

    <rect x="858" y="0" rx="16" ry="16" width="128" height="34" class="chip"/>
    <text x="922" y="22" text-anchor="middle" class="chipText">Socket.IO</text>
  </g>

  <!-- Right corner tag -->
  <g transform="translate(880, 86)">
    <rect x="0" y="0" rx="18" ry="18" width="232" height="40" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="116" y="26" text-anchor="middle" class="chipText">Available • JR / MID</text>
  </g>

  <!-- Small wave hand -->
  <text x="460" y="160" font-size="48" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">👋</text>

  <!-- Footer links (visual only) -->
  <text x="88" y="326" class="meta">linkedin.com/in/ricardosalas17 • github.com/RicardoSalas17</text>
</svg>
